        <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode" onclick="(function(b){var d=document.documentElement,t=d.getAttribute('data-theme')==='dark'?'':'dark';d.setAttribute('data-theme',t||'');b.setAttribute('aria-pressed',t?'true':'false');localStorage.setItem('theme',t)})(this)">theme</button>
